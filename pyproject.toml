[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "astranotes"
version = "0.1.0"
description = "A secure, modular, local-first note-taking application"
requires-python = ">=3.10"
dependencies = [
    # Fernet symmetric encryption for private note bodies (SPR-01)
    # License: Apache 2.0 / BSD
    "cryptography==44.0.0",
    # GUI presentation tier - 3-tier desktop frontend (NFR-02)
    # License: CC0-1.0 (public domain; strictly more permissive than the
    # SPR-04 MIT/Apache/BSD allowlist - accepted via ADR-006)
    "customtkinter==5.2.2",
    # Icon generation + CTkImage support
    # License: MIT-CMU
    "Pillow>=10.0",
]

[project.optional-dependencies]
dev = [
    # Unit testing framework (SPR-03)
    "pytest==8.3.4",
    # BDD testing — Gherkin feature files + step definitions
    "pytest-bdd>=7.3,<9",
    # Static security analysis (SAST) gate
    "bandit[toml]>=1.7",
]

[tool.setuptools.packages.find]
include = ["astranotes*"]
exclude = ["tests*", "planning*", "submissions*", "docs*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
